plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'com.realtimetech'
version = '0.2.2-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

tasks.register('printProjectVersion') {
    doLast {
        println project.version
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jetbrains:annotations:24.1.0'

    testImplementation platform('org.junit:junit-bom:5.11.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // For performance test
    testImplementation 'com.google.code.gson:gson:2.12.1'
    testImplementation 'com.esotericsoftware:kryo:5.6.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
}

test {
    useJUnitPlatform()

    jvmArgs '--add-opens=java.base/java.time=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED'
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates(project.group.toString(), project.name, project.version.toString())

    pom {
        name = 'opack'
        description = 'An object serialization, deserialization, encoding, and decoding library'
        inceptionYear = '2021'
        url = 'https://github.com/realtimetech-solution/opack'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = 'realtimetech'
                name = 'RealtimeTech'
            }
            developer {
                id = 'devjeonghwan'
                name = 'Jeonghwan Park'
                email = 'dev.parkjeonghwan@gmail.com'
            }
            developer {
                id = 'rodamin'
                name = 'Soyeon Kim'
                email = 'epals8962@realtimetech.co.kr'
            }
        }

        scm {
            connection = 'scm:git:https://github.com/realtimetech-solution/opack.git'
            developerConnection = 'scm:git:ssh://git@github.com/realtimetech-solution/opack.git'
            url = 'https://github.com/realtimetech-solution/opack'
        }
    }
}